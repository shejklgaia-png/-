name: Vendor SERA Japanese cyber fonts

# Font binaries must live in the repository so Android GitSync and offline APK
# builds never fetch fonts at game runtime. Trigger only for vendor code changes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sera-vendor-ui-fonts.yml'
      - 'tools/sera_vendor_ui_fonts.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sera-vendor-ui-fonts-main
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned official OFL font archives and verify SHA256
        run: |
          python3 tools/sera_vendor_ui_fonts.py --download
          python3 tools/sera_vendor_ui_fonts.py --check
      - name: Commit original unmodified TTFs and licenses to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/fonts/UDEVGothic-Regular.ttf assets/fonts/UDEVGothic-Bold.ttf
          git add -f assets/fonts/MoralerspaceNeon-Regular.ttf assets/fonts/MoralerspaceNeon-Bold.ttf
          git add -f assets/fonts/OFL-UDEVGothic.txt assets/fonts/OFL-Moralerspace.txt
          if git diff --cached --quiet; then
            echo "Required font files already committed."
            exit 0
          fi
          git commit -m "chore(fonts): vendor UDEV Gothic 2.2.0 and Moralerspace Neon 2.0.0"
          git pull --rebase origin main
          git push origin HEAD:main
