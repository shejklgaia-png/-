name: SERA Bittaran focused runtime
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/sera-bittaran-focused.yml'
      - 'models/bosses/**'
      - 'assets/bittaran_data.gd'
      - 'scripts/bittaran_*.gd'
      - 'scripts/sera_facing_angle_debug.gd'
      - 'scenes/bittaran_battle.tscn'
      - 'tools/v345_bittaran_*.py'
      - 'tools/v345_bittaran_*.gd'
      - 'tools/rebuild_bittaran_data.py'
      - 'scripts/command_nexus.gd'
      - 'project.godot'
  workflow_dispatch:
jobs:
  bittaran:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bittaran authored source and Android model snapshot
        run: |
          python3 tools/v345_bittaran_self_check.py
          python3 tools/sera_model_build.py --check
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import resources
        run: '"$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit'
      - name: Test Bittaran full scene and actual movement in Godot
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-runtime.log"
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v345_bittaran_runtime_check.gd > "$log" 2>&1
          cat "$log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V345_BITTARAN_FAIL' "$log"; then
            echo "::error::Godot reported a script/runtime failure despite process exit 0"
            exit 1
          fi
          grep -q 'GODOT_V345_BITTARAN_PASS' "$log"
