name: SERA Bittaran focused runtime
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/sera-bittaran-focused.yml'
      - 'models/bosses/**'
      - 'assets/bittaran_data.gd'
      - 'scripts/bittaran_*.gd'
      - 'scripts/sera_facing_angle_debug.gd'
      - 'scenes/bittaran_battle.tscn'
      - 'tools/v345_bittaran_*.py'
      - 'tools/v345_bittaran_*.gd'
      - 'tools/v346_bittaran_*.gd'
      - 'tools/v346_bittaran_*.py'
      - 'tools/v347_bittaran_*.py'
      - 'tools/v347_bittaran_*.gd'
      - 'tools/v348_bittaran_*.gd'
      - 'tools/v348_bittaran_*.py'
      - 'tools/v349_bittaran_*.py'
      - 'tools/v349_bittaran_*.gd'
      - 'tools/v350_bittaran_*.gd'
      - 'tools/v350_bittaran_*.py'
      - 'tools/v351_bittaran_*.gd'
      - 'tools/v351_bittaran_*.py'
      - 'tools/v352_bittaran_*.gd'
      - 'tools/v352_bittaran_*.py'
      - 'tools/v353_bittaran_*.gd'
      - 'tools/v353_bittaran_*.py'
      - 'tools/v354_bittaran_*.gd'
      - 'tools/v356_bittaran_*.gd'
      - 'tools/v357_bittaran_*.gd'
      - 'tools/v358_bittaran_*.gd'
      - 'tools/v359_bittaran_*.gd'
      - 'tools/v360_bittaran_*.gd'
      - 'tools/v361_bittaran_*.gd'
      - 'tools/v362_bittaran_*.gd'
      - 'tools/v363_bittaran_*.gd'
      - 'tools/v364_bittaran_*.gd'
      - 'tools/v365_bittaran_*.gd'
      - 'tools/v366_bittaran_*.gd'
      - 'tools/v367_bittaran_*.gd'
      - 'tools/v368_bittaran_*.gd'
      - 'tools/v369_bittaran_*.gd'
      - 'tools/v370_bittaran_*.gd'
      - 'tools/v371_bittaran_*.gd'
      - 'tools/v372_bittaran_*.gd'
      - 'tools/v373_bittaran_*.gd'
      - 'tools/v374_bittaran_*.gd'
      - 'tools/v375_bittaran_*.gd'
      - 'tools/v376_bittaran_*.gd'
      - 'tools/v377_bittaran_*.gd'
      - 'tools/v378_bittaran_*.gd'
      - 'tools/v379_bittaran_*.gd'
      - 'tools/rebuild_bittaran_data.py'
      - 'scripts/command_nexus.gd'
      - 'project.godot'
  workflow_dispatch:
jobs:
  bittaran:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Bittaran authored source and Android model snapshot
        run: |
          python3 tools/v345_bittaran_self_check.py
          python3 tools/v346_bittaran_ik_self_check.py
          python3 tools/v347_bittaran_scale_crouch_self_check.py
          python3 tools/v348_bittaran_parts_self_check.py
          python3 tools/v349_bittaran_down_lock_self_check.py
          python3 tools/v350_bittaran_shin_lock_self_check.py
          python3 tools/v351_bittaran_horizontal_lock_self_check.py
          python3 tools/v352_bittaran_body_center_self_check.py
          python3 tools/v353_bittaran_symmetric_lock_self_check.py
          python3 tools/sera_model_build.py --check
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import resources
        run: '"$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit'
      - name: Test Bittaran full scene and actual movement in Godot
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-runtime.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v345_bittaran_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran battle runtime exited with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V345_BITTARAN_FAIL' "$log"; then
            echo "::error::Godot reported a script/runtime failure despite process exit 0"
            exit 1
          fi
          grep -q 'GODOT_V345_BITTARAN_PASS' "$log"
      - name: Test grounded four-leg IK and no-sliding contacts
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-ik.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v346_bittaran_ik_runtime_check.gd > "$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            cat "$log"
            echo "::error::Bittaran IK runtime exited with code $status"
            exit "$status"
          fi
          cat "$log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V346_BITTARAN_IK_FAIL' "$log"; then
            echo "::error::Bittaran IK/Godot reported an error"
            exit 1
          fi
          grep -q 'GODOT_V346_BITTARAN_IK_PASS' "$log"
      - name: Test doubled Bittaran size and grounded deep knee crouch
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-crouch.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v347_bittaran_scale_crouch_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran crouch test failed with exit code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V347_BITTARAN_SIZE_CROUCH_FAIL' "$log"; then
            echo "::error::Bittaran crouch/Godot reported a runtime error"
            exit 1
          fi
          grep -q 'GODOT_V347_BITTARAN_PASS' "$log"

      - name: Verify six moving Bittaran locks, hit effects and leg-break skid
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-parts.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v348_bittaran_parts_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran 6-part combat test exited with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V348_BITTARAN_PARTS_FAIL' "$log"; then
            echo "::error::Bittaran 6-part/Godot reported a runtime error"
            exit 1
          fi
          grep -q 'GODOT_V348_BITTARAN_PARTS_PASS' "$log"
      - name: Verify down-only BODY/HEAD locks and immediate shin reacquisition
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-down-lock.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v349_bittaran_down_lock_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran lock test exited with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V349_BITTARAN_LOCK_FAIL' "$log"; then
            echo "::error::Bittaran lock/Godot reported a runtime error"
            exit 1
          fi
          grep -q 'GODOT_V349_BITTARAN_LOCK_PASS' "$log"
      - name: Verify 2x shin-only horizontal lock volumes never change melee/physics
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-shin-lock-v350.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v350_bittaran_shin_lock_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran 2x shin-only lock test exited with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V350_BITTARAN_SHIN_LOCK_FAIL' "$log"; then
            echo "::error::Bittaran shin lock reported a runtime error"
            exit 1
          fi
          grep -q 'GODOT_V350_BITTARAN_SHIN_LOCK_PASS' "$log"
      - name: Verify Bittaran two lock rays stay level regardless of boss height
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-horizontal-rays-v351.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v351_bittaran_horizontal_lock_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran horizontal ray runtime exited with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V351_BITTARAN_HORIZONTAL_LOCK_FAIL' "$log"; then
            echo "::error::Godot Bittaran horizontal ray test reported an error"
            exit 1
          fi
          grep -q 'GODOT_V351_BITTARAN_HORIZONTAL_LOCK_PASS' "$log"
      - name: Confirm BODY mesh center is horizontal lock-ray destination
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-body-center-v352.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v352_bittaran_body_center_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran BODY lock ray test exited with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V352_BITTARAN_BODY_CENTER_FAIL' "$log"; then
            echo "::error::Bittaran BODY center test reported a Godot error"
            exit 1
          fi
          grep -q 'GODOT_V352_BITTARAN_BODY_CENTER_PASS' "$log"
      - name: Verify symmetric front-rear lock transition in both orbit directions
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-symmetric-lock-v353.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v353_bittaran_symmetric_lock_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran lock symmetry test failed with exit code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V353_BITTARAN_SYMMETRIC_LOCK_FAIL' "$log"; then
            echo "::error::Bittaran symmetric lock test reported a Godot error"
            exit 1
          fi
          grep -q 'GODOT_V353_BITTARAN_SYMMETRIC_LOCK_PASS' "$log"
      - name: Verify visible post-IK shin boundary and full scene acquisition
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-symmetric-lock-v354.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v354_bittaran_live_boundary_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran lock symmetry test failed with exit code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V354_BITTARAN_LIVE_BOUNDARY_FAIL' "$log"; then
            echo "::error::Bittaran symmetric lock test reported a Godot error"
            exit 1
          fi
          grep -q 'GODOT_V354_BITTARAN_LIVE_BOUNDARY_PASS' "$log"

      - name: Verify no left/right overlap flicker at Bittaran frontal spawn
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-lateral-v356.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v356_bittaran_lateral_lock_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran lateral lock test failed with exit code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V356_BITTARAN_LATERAL_FAIL' "$log"; then
            echo "::error::Bittaran lateral lock test reported a Godot runtime error"
            exit 1
          fi
          grep -q 'GODOT_V356_BITTARAN_LATERAL_PASS' "$log"

      - name: Verify far-side screen rotation, downed clearance and head tracking
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v357.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v357_bittaran_down_clearance_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran downed clearance test failed with exit code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V357_BITTARAN_FAIL' "$log"; then
            echo "::error::Bittaran downed clearance reported a Godot runtime error"
            exit 1
          fi
          grep -q 'GODOT_V357_BITTARAN_PASS' "$log"

      - name: Verify heavy 0.6s windup, neutral downed head and grounded soles
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v358.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v358_bittaran_windup_grounding_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v358 windup/grounding test failed: $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V358_BITTARAN_FAIL' "$log"; then
            echo "::error::Bittaran v358 reported a runtime failure"
            exit 1
          fi
          grep -q 'GODOT_V358_BITTARAN_PASS' "$log"

      - name: Verify downed HEAD auto lock and SERA-centered controller/flick axis
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v359.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v359_bittaran_head_lock_controller_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v359 downed HEAD/controller test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V359_BITTARAN_LOCK_AXIS_FAIL' "$log"; then
            echo "::error::Bittaran v359 reported a Godot regression"
            exit 1
          fi
          grep -q 'GODOT_V359_BITTARAN_LOCK_AXIS_PASS' "$log"

      - name: Verify 180-degree controller inversion and camera near-plane fallback
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v360.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v360_bittaran_controller_depth_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v360 depth-safe compass test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V360_BITTARAN_AXIS_FAIL' "$log"; then
            echo "::error::Bittaran v360 compass reported a Godot regression"
            exit 1
          fi
          grep -q 'GODOT_V360_BITTARAN_AXIS_PASS' "$log"

      - name: Verify under-head turning foot sideways down and self-collision contact
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v361.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v361_bittaran_head_on_leg_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v361 under-head support collision test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V361_BITTARAN_SUPPORT_FAIL' "$log"; then
            echo "::error::Bittaran v361 reported a Godot regression"
            exit 1
          fi
          grep -q 'GODOT_V361_BITTARAN_SUPPORT_PASS' "$log"

      - name: Verify Turn and Approach remain paused until fully upright after down
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v362.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v362_bittaran_standup_motion_gate_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v362 stand-up/locomotion gate test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V362_BITTARAN_STANDUP_FAIL' "$log"; then
            echo "::error::Bittaran v362 reported a Godot regression"
            exit 1
          fi
          grep -q 'GODOT_V362_BITTARAN_STANDUP_PASS' "$log"

      - name: Verify 70-percent head tracking and progressively eased stand-up turn
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v363.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v363_bittaran_rise_turn_head_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v363 stand-up turn/head tracking test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V363_BITTARAN_RISE_FAIL' "$log"; then
            echo "::error::Bittaran v363 reported a Godot regression"
            exit 1
          fi
          grep -q 'GODOT_V363_BITTARAN_RISE_PASS' "$log"

      - name: Verify early pre-rise turning and slow, arm-safe head reacquisition
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v364.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v364_bittaran_head_clear_early_turn_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v364 early yaw and head/arm clearance runtime failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V364_BITTARAN_HEAD_CLEAR_FAIL' "$log"; then
            echo "::error::Bittaran v364 reported a Godot regression"
            exit 1
          fi
          grep -q 'GODOT_V364_BITTARAN_HEAD_CLEAR_PASS' "$log"

      - name: Verify full-rate turning begins on exact first stand-up frame with no interpolation
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v365.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v365_bittaran_immediate_standup_yaw_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v365 immediate stand-up yaw test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V365_BITTARAN_YAW_START_FAIL' "$log"; then
            echo "::error::Bittaran v365 runtime reported a regression"
            exit 1
          fi
          grep -q 'GODOT_V365_BITTARAN_YAW_START_PASS' "$log"

      - name: Verify Turn and Approach clips, IK gait and movement begin with stand-up
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v366.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v366_bittaran_live_rise_motion_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v366 live stand-up motion test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V366_BITTARAN_LIVE_RISE_FAIL' "$log"; then
            echo "::error::Bittaran v366 runtime reported a regression"
            exit 1
          fi
          grep -q 'GODOT_V366_BITTARAN_LIVE_RISE_PASS' "$log"

      - name: Verify planted feet during rise and live landing-target catch-up after stand-up
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v367.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v367_bittaran_body_turn_foot_catchup_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v367 body/foot landing sync test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V367_BITTARAN_FOOT_CATCHUP_FAIL' "$log"; then
            echo "::error::Bittaran v367 runtime reported a regression"
            exit 1
          fi
          grep -q 'GODOT_V367_BITTARAN_FOOT_CATCHUP_PASS' "$log"

      - name: Verify all four consecutive limb breaks with 1.0s / 1.3s stand-up
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/bittaran-v368.log"
          status=0
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v368_bittaran_repeat_break_fast_rise_runtime_check.gd > "$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Bittaran v368 repeated limb break / new rise duration test failed with code $status"
            exit "$status"
          fi
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|ERROR: Failed to load|Invalid call|V368_REPEAT_BREAK_FAIL' "$log"; then
            echo "::error::Bittaran v368 runtime reported regression"
            exit 1
