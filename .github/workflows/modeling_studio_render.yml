name: Modeling Studio - authoring render
on:
  workflow_dispatch:
    inputs:
      design:
        description: JSON design under tools/modeling_studio
        default: tools/modeling_studio/example.json
        required: true
        type: string
      iteration_mode:
        description: Run ten guarded CRATE V10 iterations (overrides design)
        required: false
        type: boolean
        default: false
      structural_mode:
        description: With iteration_mode, use part-level structural redesign instead of small offsets
        required: false
        type: boolean
        default: true
      reference_design_mode:
        description: With structural iteration, use local reference masks and armor redesign
        required: false
        type: boolean
        default: true
      industrial_design_mode:
        description: With reference design iteration, use researched industrial component shapes
        required: false
        type: boolean
        default: true
      arm_search_mode:
        description: With industrial iteration, use independent contact-driven arm search
        required: false
        type: boolean
        default: false
      shoulder_track_mode:
        description: With iteration mode, run compact shoulder and open track reconstruction
        required: false
        type: boolean
        default: false
      reference_manifest:
        description: Optional independent orthographic mask manifest under tools/modeling_studio
        required: false
        type: string
      crate_baseline:
        description: Export and render current production CRATE
        required: false
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/modeling_studio/**'
      - '.github/workflows/modeling_studio_render.yml'
permissions:
  contents: read
jobs:
  authoring:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && (startsWith(github.head_ref, 'feat/modeling-studio-') || startsWith(github.head_ref, 'modeling/')))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (inputs.iteration_mode == true || startsWith(github.head_ref, 'modeling/crate-blockout-loop-')) && 120 || 25 }}
    env:
      DESIGN: ${{ ((inputs.iteration_mode == true || startsWith(github.head_ref, 'modeling/crate-blockout-loop-')) && 'tools/modeling_studio/crate_blockout_v10.json') || inputs.design || (startsWith(github.head_ref, 'modeling/crate-blockout-v10-') && 'tools/modeling_studio/crate_blockout_v10.json') || (startsWith(github.head_ref, 'modeling/crate-blockout-v9-') && 'tools/modeling_studio/crate_blockout_v9.json') || (startsWith(github.head_ref, 'modeling/crate-blockout-v8-') && 'tools/modeling_studio/crate_blockout_v8.json') || (startsWith(github.head_ref, 'modeling/crate-blockout-') && 'tools/modeling_studio/crate_blockout_v7.json') || (startsWith(github.head_ref, 'modeling/structure-analysis-v6-') && 'tools/modeling_studio/mechanism_crate_study.json') || (startsWith(github.head_ref, 'modeling/structure-analysis-') && 'tools/modeling_studio/hard_surface_example.json') || (startsWith(github.head_ref, 'modeling/hard-surface-') && 'tools/modeling_studio/hard_surface_example.json') || (startsWith(github.head_ref, 'modeling/wireframe-guides-') && 'tools/modeling_studio/wireframe_example.json') || (startsWith(github.head_ref, 'modeling/crate-threeview-refine-v2-') && 'tools/modeling_studio/crate_threeview_v2.json') || (startsWith(github.head_ref, 'modeling/crate-threeview-') && 'tools/modeling_studio/crate_threeview_v1.json') || 'tools/modeling_studio/example.json' }}
      STRUCTURAL_MODE: ${{ startsWith(github.head_ref, 'modeling/crate-blockout-loop-v2-') || (inputs.iteration_mode == true && inputs.structural_mode == true) }}
      REFERENCE_DESIGN_MODE: ${{ startsWith(github.head_ref, 'modeling/crate-blockout-loop-v3-') || (inputs.iteration_mode == true && inputs.structural_mode == true && inputs.reference_design_mode == true) }}
      INDUSTRIAL_DESIGN_MODE: ${{ startsWith(github.head_ref, 'modeling/crate-blockout-loop-v4-') || (inputs.iteration_mode == true && inputs.structural_mode == true && inputs.reference_design_mode == true && inputs.industrial_design_mode == true) }}
      ARM_SEARCH_MODE: ${{ startsWith(github.head_ref, 'modeling/crate-blockout-loop-v4-arm-search-') || (inputs.iteration_mode == true && inputs.structural_mode == true && inputs.reference_design_mode == true && inputs.industrial_design_mode == true && inputs.arm_search_mode == true) }}
      SHOULDER_TRACK_MODE: ${{ startsWith(github.head_ref, 'modeling/crate-blockout-loop-v6-') || (inputs.iteration_mode == true && inputs.shoulder_track_mode == true) }}
      REFERENCE_MANIFEST: ${{ inputs.reference_manifest || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check modeling Python syntax before installing Blender
        run: python3 -m compileall -q tools/modeling_studio
      - name: Check reference metric math independently
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/review-venv"
          "$RUNNER_TEMP/review-venv/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/check_reference_metrics.py
      - name: Install Blender 4.5.3 LTS
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=blender-4.5.3-linux-x64.tar.xz
          ok=0
          for base in https://download.blender.org/release/Blender4.5 https://mirror.blender.org/release/Blender4.5; do
            rm -f "$archive" checksums.txt selected.sha256
            if curl --fail --location --retry 2 --connect-timeout 20 --max-time 240 "$base/blender-4.5.3.sha256" -o checksums.txt &&
               awk -v a="$archive" '$2==a || $2=="*"a {print}' checksums.txt > selected.sha256 &&
               test "$(wc -l < selected.sha256)" -eq 1 &&
               curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 "$base/$archive" -o "$archive" &&
               sha256sum --check selected.sha256; then
              ok=1
              break
            fi
            echo "::warning::Blender source failed: $base"
          done
          test "$ok" -eq 1
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-4.5.3-linux-x64" >> "$GITHUB_PATH"
      - name: Check camera fit and static interference
        run: blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/check_geometry_review.py
      - name: Generate model and review images
        shell: bash
        run: |
          set -euo pipefail
          design=$(realpath -- "$DESIGN")
          root=$(realpath tools/modeling_studio)
          [[ "$design" == "$root/"*.json && -f "$design" ]]
          if [[ "$SHOULDER_TRACK_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/pip" install numpy==2.2.6
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/shoulder_track_search.py prepare "$design" "$RUNNER_TEMP/crate-v6-seed.json"
            design="$RUNNER_TEMP/crate-v6-seed.json"
          elif [[ "$ARM_SEARCH_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/pip" install numpy==2.2.6
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/arm_search.py prepare "$design" "$RUNNER_TEMP/crate-arm-search-seed.json"
            design="$RUNNER_TEMP/crate-arm-search-seed.json"
          elif [[ "$INDUSTRIAL_DESIGN_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/pip" install numpy==2.2.6
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/industrial_design_variants.py "$design" "$RUNNER_TEMP/crate-industrial-seed.json"
            design="$RUNNER_TEMP/crate-industrial-seed.json"
          elif [[ "$REFERENCE_DESIGN_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/pip" install numpy==2.2.6
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/reference_design_variants.py "$design" "$RUNNER_TEMP/crate-reference-seed.json"
            design="$RUNNER_TEMP/crate-reference-seed.json"
          elif [[ "$STRUCTURAL_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/structural_variants.py "$design" "$RUNNER_TEMP/crate-structural-seed.json"
            design="$RUNNER_TEMP/crate-structural-seed.json"
          fi
          blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/build.py -- "$design" "$RUNNER_TEMP/sera-model"
          cp "$design" "$RUNNER_TEMP/sera-model/design.json"
      - name: Inspect GLBs with Godot 4.7.2 in isolated project
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot-model-review"
          mkdir -p "$godot_dir/project"
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 240 "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$archive" -o "$godot_dir/$archive"
          unzip -q "$godot_dir/$archive" -d "$godot_dir"
          printf 'config_version=5\n[application]\nconfig/name="Model review only"\n[rendering]\nrenderer/rendering_method="gl_compatibility"\n' > "$godot_dir/project/project.godot"
          cp tools/modeling_studio/check_godot_import.gd "$godot_dir/project/"
          "$godot_dir/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$godot_dir/project" --script res://check_godot_import.gd -- "$RUNNER_TEMP/sera-model"
          test -s "$RUNNER_TEMP/sera-model/godot_import.json"
      - name: Export and render current CRATE
        if: inputs.crate_baseline == true || startsWith(github.head_ref, 'modeling/crate-baseline-')
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot-model-review"
          out="$RUNNER_TEMP/sera-model/crate_baseline"
          mkdir -p "$out"
          cp scripts/sera_crate_model.gd tools/modeling_studio/export_crate_baseline.gd "$godot_dir/project/"
          "$godot_dir/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$godot_dir/project" --script res://export_crate_baseline.gd -- "$out"
          test -s "$out/crate_current.glb"
          blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/render_crate_baseline.py -- "$out"
          git rev-parse HEAD > "$out/source_commit.txt"
          git hash-object scripts/sera_crate_model.gd > "$out/source_blob.txt"
      - name: Render reference-fitted CRATE candidate
        if: startsWith(github.head_ref, 'modeling/crate-baseline-proportion-')
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/fit_crate_candidate.py -- "$RUNNER_TEMP/sera-model/crate_baseline" "$RUNNER_TEMP/sera-model/crate_candidate"
      - name: Produce and inspect CRATE detail V2
        if: startsWith(github.head_ref, 'modeling/crate-baseline-proportion-detail-')
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot-model-review"
          root="$RUNNER_TEMP/sera-model"
          variant="$root/crate_detail_source"
          out="$root/crate_detail_v2"
          mkdir -p "$variant"
          python3 tools/modeling_studio/crate_detail_variant.py scripts/sera_crate_model.gd "$godot_dir/project/sera_crate_model.gd"
          git hash-object "$godot_dir/project/sera_crate_model.gd" > "$variant/variant_source.txt"
          cp "$godot_dir/project/sera_crate_model.gd" "$variant/variant.gd"
          cp "$root/crate_baseline/source_commit.txt" "$root/crate_baseline/source_blob.txt" "$variant/"
          "$godot_dir/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$godot_dir/project" --script res://export_crate_baseline.gd -- "$variant"
          blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/render_crate_baseline.py -- "$variant"
          blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/fit_crate_candidate.py -- "$variant" "$out"
          blender --background --factory-startup --python-exit-code 1 --python tools/modeling_studio/check_crate_articulation.py -- "$out"
          cp tools/modeling_studio/check_crate_import.gd "$godot_dir/project/"
          "$godot_dir/Godot_v4.7.2-stable_linux.x86_64" --headless --path "$godot_dir/project" --script res://check_crate_import.gd -- "$out"
          test -s "$out/crate_godot_review.json"
      - name: Analyze actual rendered reference views
        if: startsWith(github.head_ref, 'modeling/structure-analysis-')
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/review-venv/bin/python"
          "$py" -m pip install opencv-python-headless==4.12.0.88
          root="$RUNNER_TEMP/sera-model"
          mkdir "$root/structure_analysis"
          for view in front right front_3q back; do
            "$py" -c 'from PIL import Image; import sys; Image.open(sys.argv[1]).convert("RGBA").getchannel("A").save(sys.argv[2])' "$root/$view.png" "$root/structure_analysis/${view}_mask.png"
            "$py" tools/modeling_studio/structure_analysis.py "$root/$view.png" "$root/structure_analysis/${view}_mask.png" "$root/structure_analysis/$view"
            "$py" tools/modeling_studio/structure_analysis_v2.py "$root/$view.png" "$root/structure_analysis/${view}_mask.png" "$root/structure_analysis/$view" "$root/structure_analysis/${view}_v2"
          done
          "$py" tools/modeling_studio/structure_metrics.py "$root/structure_analysis/labeled_fixture"
          if [[ "$GITHUB_HEAD_REF" == modeling/structure-analysis-v3-* || "$GITHUB_HEAD_REF" == modeling/structure-analysis-v4-* || "$GITHUB_HEAD_REF" == modeling/structure-analysis-v5-* ]]; then
            blender --background "$root/model.blend" --python-exit-code 1 --python tools/modeling_studio/part_id_review.py -- "$root"
            "$py" tools/modeling_studio/structure_calibration.py "$root"
          fi
          if [[ "$GITHUB_HEAD_REF" == modeling/structure-analysis-v4-* || "$GITHUB_HEAD_REF" == modeling/structure-analysis-v5-* ]]; then
            "$py" tools/modeling_studio/repeat_review.py "$root"
            "$py" tools/modeling_studio/intent_fit_review.py "$root"
          fi
          if [[ "$GITHUB_HEAD_REF" == modeling/structure-analysis-v5-* ]]; then
            "$py" tools/modeling_studio/multiview_review.py "$root"
          fi
      - name: Review primary blockout silhouette
        if: inputs.iteration_mode == true || startsWith(github.head_ref, 'modeling/crate-blockout-')
        run: |
          "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/blockout_review.py "$RUNNER_TEMP/sera-model"
      - name: Prepare review bundle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REFERENCE_MANIFEST" ]]; then
            manifest=$(realpath -- "$REFERENCE_MANIFEST")
            root=$(realpath tools/modeling_studio)
            [[ "$manifest" == "$root/"*.json && -f "$manifest" ]]
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/reference_review.py "$RUNNER_TEMP/sera-model" "$manifest" "$RUNNER_TEMP/sera-model/reference"
          fi
          export GITHUB_SHA="$(git rev-parse HEAD)"
          "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/review_bundle.py "$RUNNER_TEMP/sera-model"
          cat "$RUNNER_TEMP/sera-model/review.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload model and review bundle
        uses: actions/upload-artifact@v4
        with:
          name: sera-modeling-review
          path: ${{ runner.temp }}/sera-model/
          if-no-files-found: error
          retention-days: 14
      - name: Run ten feedback-prioritized modeling iterations
        if: inputs.iteration_mode == true || startsWith(github.head_ref, 'modeling/crate-blockout-loop-')
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SHOULDER_TRACK_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/shoulder_track_search.py run "$RUNNER_TEMP/sera-model" "$RUNNER_TEMP/sera-iterations"
            exit 0
          fi
          if [[ "$ARM_SEARCH_MODE" == true ]]; then
            "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/arm_search.py run "$RUNNER_TEMP/sera-model" "$RUNNER_TEMP/sera-iterations"
            exit 0
          fi
          flags=()
          if [[ "$INDUSTRIAL_DESIGN_MODE" == true ]]; then
            flags+=(--industrial-design)
          elif [[ "$REFERENCE_DESIGN_MODE" == true ]]; then
            flags+=(--reference-design)
          elif [[ "$STRUCTURAL_MODE" == true ]]; then
            flags+=(--structural)
          fi
          "$RUNNER_TEMP/review-venv/bin/python" tools/modeling_studio/iterative_review.py "$RUNNER_TEMP/sera-model" "$RUNNER_TEMP/sera-iterations" "${flags[@]}"
      - name: Upload all iteration models, renders and offline viewers
        if: always() && (inputs.iteration_mode == true || startsWith(github.head_ref, 'modeling/crate-blockout-loop-'))
        uses: actions/upload-artifact@v4
        with:
          name: sera-modeling-iterations
          path: ${{ runner.temp }}/sera-iterations/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload partial results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sera-modeling-partial
          path: ${{ runner.temp }}/sera-model/
          if-no-files-found: ignore
          retention-days: 7
