name: Termux safe upload regressions

on:
  pull_request:
    paths:
      - "tools/termux/**"
  push:
    branches:
      - main
    paths:
      - "tools/termux/**"

permissions:
  contents: read

jobs:
  offline-sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Termux bash syntax
        run: bash -n tools/termux/*.sh
      - name: Check Termux Python syntax
        run: python3 -m py_compile tools/termux/sera_push_safe.py tools/termux/test_safe_sync.py
      - name: Run local Git upload and conflict simulations
        run: python3 tools/termux/test_safe_sync.py
