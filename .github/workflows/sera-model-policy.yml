      - name: Verify v253 Bash on-screen actor facing and future flick conventions
        run: python3 tools/v253_screen_facing_bash_self_check.py
      - name: Verify v254 eight-way 45-degree flick sectors for STEP and Bash
        run: python3 tools/v254_eight_way_flick_self_check.py
      - name: Verify v255 common character-forward axis for STEP and Bash
        run: python3 tools/v255_flick_front_consistency_self_check.py
      - name: Verify v256 accessible Bash flick timing and preserved eight sectors
        run: python3 tools/v256_bash_accessibility_self_check.py
      - name: Verify historic v257 reticle UI isolation after v258 revert
        run: python3 tools/v257_lock_marker_flick_axis_self_check.py
      - name: Verify v258 four-way 90-degree SERA facing flicks
        run: python3 tools/v258_four_way_character_facing_self_check.py
