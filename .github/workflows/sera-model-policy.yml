# CI optimization: all original static/Godot cases are still executed;
# test subprocesses remain isolated and full test failures are reported.
# The test manifest is the authoritative inventory for both suites.
name: SERA model workflow policy
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - '.github/workflows/sera-model-policy.yml'
      - 'AGENTS.md'
      - '.gitignore'
      - 'DEVELOPMENT.md'
      - 'README*.md'
      - 'docs/**'
      - 'tools/**'
      - 'models/**'
      - 'blockbench/**'
      - 'assets/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'shaders/**'
      - 'BGM/**'
      - 'project.godot'
jobs:
  model-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify model guide and explicit review acknowledgement
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/model_policy_check.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Verify all registered historical Python regressions (batched, isolated, parallel)
        run: python3 tools/sera_ci_suite.py static --workers 4
      # Earlier static regressions all passed while the Android side kick
      # lookup failed. Test the real GDScript runtime, not just its text.
      - name: Fetch Godot 4.7.2 for headless clip playback
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import SERA resources in real Godot 4.7.2
        run: '"$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit'
      - name: Verify all registered real-Godot regressions (isolated, parallel)
        env:
          SERA_GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
        run: python3 tools/sera_ci_suite.py godot --workers 3
      - name: Verify shared transparent render contract and new shaders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/render_policy_self_check.py
      - name: Verify base model, repository paths and development fast path
        run: |
          python3 tools/sera_quick_check.py
          python3 tools/sera_code_map.py camera --json > /dev/null
          python3 tools/sera_agent_audits_self_check.py
          python3 tools/sera_parameter_audit.py
          python3 tools/sera_change_impact.py --changed scripts/main.gd --json > /dev/null
