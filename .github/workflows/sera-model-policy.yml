      - name: Verify v267 actor-facing kick wedges and screen-space controller
        run: python3 tools/v267_actor_facing_side_kick_self_check.py
      - name: Verify v268 third-strike queued kick and video-observed STEP fix
        run: python3 tools/v268_melee3_kick_buffer_self_check.py
      - name: Verify v269 screen-right kick in side-on camera and BOOST exclusion
        run: python3 tools/v269_screen_kick_video_self_check.py
      - name: Verify v270 full horizontal kick priority and input diagnostic telemetry
        run: python3 tools/v270_kick_input_priority_diagnostic_self_check.py
      - name: Verify v271 embedded side-kick clips recover from stale Android JSON
        run: python3 tools/v271_embedded_kick_runtime_recovery_self_check.py
      - name: Verify v272 independent authored kick pack and UUID/name mapping
        run: python3 tools/v272_dedicated_kick_pack_self_check.py
      - name: Verify v273 canonical kick name and avoid conditional typed Array
        run: python3 tools/v273_kick_lookup_self_check.py
      - name: Verify v274 rear somersault kick state, 4m arc and 0.2s landing
        run: python3 tools/v274_back_somersault_self_check.py
      - name: Verify v275 user-authored Kick_b and embedded data
        run: python3 tools/v275_authored_back_kick_self_check.py
      - name: Verify v276 Katana geometry, animation and embedded data
        run: python3 tools/v276_katana_self_check.py
      - name: Verify v277 kick contact slots and Bash homing
        run: python3 tools/v277_kick_contact_self_check.py
      - name: Verify v278 half-speed lateral kicks without slowing travel
        run: python3 tools/v278_side_kick_half_speed_self_check.py
      - name: Verify v279 somersault complete last pose and landing handoff
        run: python3 tools/v279_somersault_full_completion_self_check.py
      - name: Verify v280 second-windup side travel and complete visible backflip
        run: python3 tools/v280_kick_motion_self_check.py
      - name: Verify v281 continuous Bezier arc for rear somersault
        run: python3 tools/v281_somersault_arc_self_check.py
      - name: Verify v282 continuous authored Waist turn without double rotation
        run: python3 tools/v282_somersault_authored_turn_self_check.py
      - name: Verify v283 queued Melee3 flicks cancel 0.05s after strike-through
        run: python3 tools/v283_melee3_flick_cancel_self_check.py
      - name: Verify v284 screen-fixed combo sectors, hit-only somersault and shared melee thrusters
        run: python3 tools/v284_cardinal_melee_contact_self_check.py
      - name: Verify v285 side kick orbits target and 45-degree camera polar limit
        run: python3 tools/v285_side_kick_orbit_camera_self_check.py
      - name: Verify v286 safe kick radius and lower LOCK button layout (v287 low camera)
        run: python3 tools/v286_close_camera_clearance_self_check.py
      - name: Verify v287 stable non-overhead combat camera and limited Kick_l/r angles
        run: python3 tools/v287_stable_low_camera_self_check.py
      # Earlier static regressions all passed while the Android side kick
      # lookup failed. Test the real GDScript runtime, not just its text.
      - name: Fetch Godot 4.7.2 for headless clip playback
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import SERA resources in real Godot 4.7.2
        run: '"$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit'
