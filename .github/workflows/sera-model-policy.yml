# Post-merge workflow: full Python/Godot CI runs after updates reach main.
# PR body acknowledgements are reviewed before merge; post-merge runs verify source integrity.
# CI optimization: all original static/Godot cases are still executed;
# test subprocesses remain isolated and full test failures are reported.
# The test manifest is the authoritative inventory for both suites.
name: SERA model workflow policy
# Manual-only: focused local checks are the default; retain opt-in Actions diagnostics.
on:
  workflow_dispatch:

concurrency:
  # A newer main revision supersedes the earlier post-merge verification run.
  group: sera-model-policy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  model-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify model guide references and canonical model snapshots
        run: |
          python3 tools/model_policy_check.py
          python3 tools/sera_model_build.py --check
      - name: Verify all registered historical Python regressions (batched, isolated, parallel)
        run: python3 tools/sera_ci_suite.py static --workers 4 --report-json "$RUNNER_TEMP/sera-static-results.json"
      # Earlier static regressions all passed while the Android side kick
      # lookup failed. Test the real GDScript runtime, not just its text.
      - name: Fetch Godot 4.7.2 for headless clip playback
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      # Git does not track .godot caches; speed up unchanged resource imports
      # without reintroducing editor-specific generated files to GitSync.
      - name: Cache Godot imported resources
        uses: actions/cache@v4
        with:
          path: .godot/imported
          key: sera-godot472-${{ runner.os }}-${{ hashFiles('project.godot', 'assets/**', 'models/**', 'blockbench/**', 'BGM/**', 'shaders/**') }}
          # Godot validates imported assets and reimports changed inputs.
          # Recover the last compatible cache even after a game version bump.
          restore-keys: |
            sera-godot472-${{ runner.os }}-
      # Verify font reading directly from project sources BEFORE Godot import.
      - name: Verify bundled fonts load with no Godot import cache
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path . --script tools/v547_font_raw_loader_runtime_check.gd
          timeout 120s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path . --script tools/base_startup_parse_runtime_check.gd
          timeout 120s "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --path . --script tools/v548_lab_font_mix_runtime_check.gd
      - name: Import SERA resources in real Godot 4.7.2
        run: '"$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit'
      # Headless tests verify nodes and coordinates, but cannot prove Android
      # card pixels exist. Exercise the actual software OpenGL framebuffer.
      - name: Capture and register all 19 real SeraRig equipment icons
        env:
          SERA_UI_RENDER_DIR: ${{ runner.temp }}/sera-ui-render
        run: |
          set -euo pipefail
          mkdir -p "$SERA_UI_RENDER_DIR" assets/ui/sera_equipment_icons
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          # The new common camera replaces H02's historic special capture.
          # The separate legacy IRIS regression below is read-only.
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$GODOT" --path . --rendering-method gl_compatibility \
            --script tools/icon_studio/sera_all_native_capture.gd
          python3 tools/icon_studio/tag_all_icons.py
          python3 tools/icon_studio/validate_all_icons.py
          # The reference face is local -Z; this checks front, right and
          # top independently rather than only checking whether PNG exists.
          "$GODOT" --headless --path . \
            --script tools/icon_studio/front_right_orientation_runtime_check.gd
          "$GODOT" --headless --editor --path . --import --quit
      - name: Upload all real equipment preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-native-all-equipment-icons
          path: assets/ui/sera_equipment_icons/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified equipment PNGs to this PR branch
        if: github.event_name == 'pull_request' && success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/sera_equipment_icons
          if ! git diff --cached --quiet; then
            git commit -m "assets: register all 19 verified SeraRig photographs [skip ci]"
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          fi
      - name: Verify real equipment photos, stat coverage and LABO UI early
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script tools/equipment_registry_runtime_check.gd
          "$GODOT" --headless --path . --script tools/equipment_icon_tech_frame_runtime_check.gd
          "$GODOT" --headless --path . --script tools/v527_android_icon_resilience_runtime_check.gd
          "$GODOT" --headless --path . --script tools/v553_labo_controls_runtime_check.gd
      - name: Verify new equipment details and NEXUS interactive controls early
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script tools/equipment_portrait_ui_runtime_check.gd
          "$GODOT" --headless --path . --script tools/nexus_equipment_stats_runtime_check.gd
          "$GODOT" --headless --path . --script tools/nexus_labo_visual_runtime_check.gd
          "$GODOT" --headless --path . --script tools/v549_refinery_names_warehouse_glyphs_runtime_check.gd
      - name: Verify actual facility card pixels in a virtual display
        env:
          SERA_UI_RENDER_DIR: ${{ runner.temp }}/sera-ui-render
        run: |
          set -euo pipefail
          mkdir -p "$SERA_UI_RENDER_DIR"
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --path . --rendering-method gl_compatibility \
            --script tools/v522_visible_card_pixels_runtime_check.gd
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --path . --rendering-method gl_compatibility \
            --script tools/base_isometric_visual_capture.gd
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --path . --rendering-method gl_compatibility \
            --script tools/base_junk_visual_capture.gd
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --path . --rendering-method gl_compatibility \
            --script tools/base_power_board_visual_capture.gd
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --path . --rendering-method gl_compatibility \
            --script tools/base_grid_edit_visual_capture.gd
      # Use the *same* compiled Godot GL Compatibility armor materials,
      # camera-dependent outline shader and combat-stage lights as SERA.
      # This is build-time capture, never a per-card/per-frame Android cost.
      - name: Capture IRIS with real Godot GL Compatibility renderer
        env:
          SERA_UI_RENDER_DIR: ${{ runner.temp }}/sera-ui-render
        run: |
          set -euo pipefail
          mkdir -p "$SERA_UI_RENDER_DIR"
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --path . --rendering-method gl_compatibility \
            --script tools/icon_studio/sera_godot_native_capture.gd
          python3 tools/icon_studio/annotate_godot_native_png.py \
            --png "$SERA_UI_RENDER_DIR/SERA_H02_IRIS_GODOT_512.png"
          test -s "$SERA_UI_RENDER_DIR/SERA_H02_IRIS_GODOT_512.png"
      - name: Upload native SERA equipment portrait
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-native-equipment-icon
          path: ${{ runner.temp }}/sera-ui-render/SERA_H02_IRIS_GODOT_512.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload actual software-rendered facility screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-native-facility-and-base-framing
          path: ${{ runner.temp }}/sera-ui-render/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify all registered real-Godot regressions (isolated, parallel)
        env:
          SERA_GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
        run: python3 tools/sera_ci_suite.py godot --workers 3 --report-json "$RUNNER_TEMP/sera-godot-results.json"
      # These reports help identify high-cost tests without hiding coverage.
      - name: Publish CI test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-ci-per-test-durations
          path: |
            ${{ runner.temp }}/sera-static-results.json
            ${{ runner.temp }}/sera-godot-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify shared transparent render contract and new shaders
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 tools/render_policy_self_check.py
      - name: Verify base model, repository paths and development fast path
        run: |
          python3 tools/sera_quick_check.py
          python3 tools/sera_code_map.py camera --json > /dev/null
          python3 tools/sera_agent_audits_self_check.py
          python3 tools/sera_parameter_audit.py
          python3 tools/sera_change_impact.py --changed scripts/main.gd --json > /dev/null
      # The screenshots are generated and checked in CI, not during Android
      # gameplay. A bot commit publishes exactly the reviewed model portraits.
      - name: Publish verified native portrait cache to main
        if: github.ref == 'refs/heads/main' && success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/sera_equipment_icons
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish 19 real SeraRig native equipment portraits [skip ci]"
            git push origin HEAD:main
          fi
