name: SERA model workflow policy
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
    paths:
      - 'AGENTS.md'
      - 'docs/SERA_DEVELOPMENT_FASTPATH_ja.md'
      - 'tools/sera_code_map.py'
      - 'tools/sera_quick_check.py'
      - 'tools/sera_dev_tools_self_check.py'
      - 'tools/sera_parameter_audit.py'
      - 'tools/sera_change_impact.py'
      - 'tools/sera_agent_audits_self_check.py'
      - 'docs/SERA_AGENT_MAINTENANCE_ja.md'
      - '.gitignore'
      - 'models/**'
      - 'blockbench/**'
      - 'assets/AGENTS.md'
      - 'assets/sera_source.json'
      - 'assets/sera_data.gd'
      - 'assets/sera_equipment_data.gd'
      - 'assets/sera_lower_body_d_data.gd'
      - 'assets/sera_bird_data.gd'
      - 'scripts/AGENTS.md'
      - 'scripts/sera_rig.gd'
      - 'scripts/render_order_policy.gd'
      - 'scripts/sword_trail.gd'
      - 'scripts/sera_equipment.gd'
      - 'tools/rebuild_model_data.py'
      - 'tools/rebuild_equipment_data.py'
      - 'tools/rebuild_bird_data.py'
      - 'tools/v189_bird_headc_self_check.py'
      - 'tools/v190_foot_contact_grounding_self_check.py'
      - 'tools/v191_standard_foot_c_self_check.py'
      - 'tools/v192_foot_slot_preview_self_check.py'
      - 'tools/v193_lower_body_slot_migration_self_check.py'
      - 'tools/legs_c_standard_source_self_check.py'
      - 'tools/rebuild_lower_body_d_data.py'
      - 'tools/v194_lower_body_d_customization_self_check.py'
      - 'tools/rebuild_lower_body_d_from_author.py'
      - 'tools/v195_lower_body_d_proportions_self_check.py'
      - 'tools/v196_nexus_pose_arm_clearance_self_check.py'
      - 'tools/v197_nexus_pose_overlift_self_check.py'
      - 'tools/v198_version_indicator_self_check.py'
      - 'tools/v199_animated_sole_grounding_self_check.py'
      - 'tools/v200_contact_omni_step_self_check.py'
      - 'tools/v235_forward_step_distance_self_check.py'
      - 'tools/v236_lateral_step_no_proximity_slowdown_self_check.py'
      - 'tools/v237_target_parts_break_lock_self_check.py'
      - 'tools/v238_target_mecha_frame_self_check.py'
      - 'tools/v239_target_rectangular_body_self_check.py'
      - 'tools/v240_target_large_limb_self_check.py'
      - 'tools/v241_thruster_lift_downwash_self_check.py'
      - 'tools/v261_rear_diagonal_thruster_self_check.py'
      - 'tools/v262_continuous_step_blend_self_check.py'
      - 'tools/v242_screen_lock_buttons_self_check.py'
      - 'tools/v243_controller_quadrant_lock_mode_self_check.py'
      - 'tools/v244_half_size_run_boost_controller_self_check.py'
      - 'tools/v245_controller_125_percent_self_check.py'
      - 'tools/v246_fullscreen_controller_self_check.py'
      - 'tools/v247_transparent_controller_self_check.py'
      - 'tools/v248_controller_150_percent_self_check.py'
      - 'tools/v249_exclusive_attack_lock_self_check.py'
      - 'tools/v250_target_hp_self_check.py'
      - 'tools/v251_target_part_movement_collision_self_check.py'
      - 'tools/v252_screen_direction_step_self_check.py'
      - 'tools/v253_screen_facing_bash_self_check.py'
      - 'tools/v254_eight_way_flick_self_check.py'
      - 'tools/v255_flick_front_consistency_self_check.py'
      - 'tools/v256_bash_accessibility_self_check.py'
      - 'tools/v257_lock_marker_flick_axis_self_check.py'
      - 'tools/v258_four_way_character_facing_self_check.py'
      - 'tools/v259_combo_lock_hold_self_check.py'
      - 'tools/v260_screen_step_direction_self_check.py'
      - 'scripts/flick_direction_policy.gd'
      - 'scripts/training_target_motion.gd'
      - 'scripts/enemy_shooter.gd'
      - 'scripts/target_parts.gd'
      - 'tools/v204_heavy_leg_slide_self_check.py'
      - 'tools/v227_slide_leg_ik_self_check.py'
      - 'tools/v228_slide_flat_soles_self_check.py'
      - 'tools/v229_slide_boost_camera_self_check.py'
      - 'tools/v230_close_boost_camera_self_check.py'
      - 'tools/v231_camera_physics_interpolation_self_check.py'
      - 'tools/v232_boost_edge_camera_self_check.py'
      - 'tools/v233_close_camera_radius_self_check.py'
      - 'tools/v234_near_camera_dolly_self_check.py'
      - 'tools/v205_back_booster_stub_self_check.py'
      - 'tools/v206_back_thruster_fx_self_check.py'
      - 'scripts/back_thruster_fx.gd'
      - 'shaders/sera_energy_flash.gdshader'
      - 'shaders/sera_foreground.gdshader'
      - 'shaders/**'
      - 'tools/v207_boost_exhaust_en_self_check.py'
      - 'tools/v208_thruster_angle_limits_self_check.py'
      - 'tools/v209_nozzle_run_stability_self_check.py'
      - 'tools/v210_backstroke_thruster_self_check.py'
      - 'tools/v211_frontstep_self_check.py'
      - 'tools/v212_slide_nozzle_screen_direction_self_check.py'
      - 'tools/v213_left_nozzle_quadrant_self_check.py'
      - 'tools/v214_turn_boost_exhaust_self_check.py'
      - 'tools/v215_bird_gait_grounding_self_check.py'
      - 'tools/v216_thruster_acceleration_burst_self_check.py'
      - 'tools/v217_thruster_burst_size_time_self_check.py'
      - 'tools/v218_thruster_short_15x_flare_self_check.py'
      - 'tools/v219_decagonal_thruster_50ms_self_check.py'
      - 'tools/v220_melee_full_swing_exhaust_self_check.py'
      - 'tools/v221_melee_jet_visibility_self_check.py'
      - 'tools/v222_nozzle_torso_clearance_self_check.py'
      - 'tools/v223_thruster_ribbon_trail_self_check.py'
      - 'tools/v224_melee_nozzle_articulation_self_check.py'
      - 'tools/v225_thruster_draw_order_self_check.py'
      - 'tools/render_policy_self_check.py'
      - 'docs/RENDER_PIPELINE_POLICY_ja.md'
      - 'shaders/back_thruster_trail.gdshader'
      - 'shaders/back_thruster.gdshader'
      - 'scripts/sera_equipment.gd'
      - 'scripts/sera_rig.gd'
      - 'scripts/version_indicator.gd'
      - 'scripts/launch_menu.gd'
      - 'scripts/main.gd'
      - 'scripts/command_nexus.gd'
      - 'tools/model_policy_check.py'
      - 'docs/MODEL_PART_WORKFLOW_ja.md'
      - '.github/workflows/sera-model-policy.yml'
jobs:
  model-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify model guide and explicit review acknowledgement
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/model_policy_check.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Verify v189 bird legs and Head C assets
        run: python3 tools/v189_bird_headc_self_check.py
      - name: Verify v190 turning, contact and grounding
        run: python3 tools/v190_foot_contact_grounding_self_check.py
      - name: Verify v191 standard Foot C attachment
        run: python3 tools/v191_standard_foot_c_self_check.py
      - name: Verify v192 Foot C independent slot and Nexus preview
        run: python3 tools/v192_foot_slot_preview_self_check.py
      - name: Verify v193 lower-body D and legacy C/D preferences
        run: python3 tools/v193_lower_body_slot_migration_self_check.py
      - name: Verify updated C author hierarchy and D runtime-ready model
        run: python3 tools/legs_c_standard_source_self_check.py
      - name: Verify v194 dedicated lower-body D customization
        run: python3 tools/v194_lower_body_d_customization_self_check.py
      - name: Verify v195 D authored proportions and colors
        run: python3 tools/v195_lower_body_d_proportions_self_check.py
      - name: Verify v196 Nexus pose and adaptive arm clearance
        run: python3 tools/v196_nexus_pose_arm_clearance_self_check.py
      - name: Verify v197 NEXUS pose collision and lift cap
        run: python3 tools/v197_nexus_pose_overlift_self_check.py
      - name: Verify v198 version indicator on all screens
        run: python3 tools/v198_version_indicator_self_check.py
      - name: Verify v199 dynamic shoe sole grounding
        run: python3 tools/v199_animated_sole_grounding_self_check.py
      - name: Verify v200 foot-contact grounding and 360-degree step
        run: python3 tools/v200_contact_omni_step_self_check.py
      - name: Verify v235 3m forward STEP and unchanged lateral/backward STEP
        run: python3 tools/v235_forward_step_distance_self_check.py
      - name: Verify v236 lateral STEP constant speed, radial STEP preserved
        run: python3 tools/v236_lateral_step_no_proximity_slowdown_self_check.py
      - name: Verify v237 five-part target, part breaks and auto-lock
        run: python3 tools/v237_target_parts_break_lock_self_check.py
      - name: Verify v242 screen-relative lock switch buttons and isolated touch
        run: python3 tools/v242_screen_lock_buttons_self_check.py
      - name: Verify v243 bottom-right quadrant controller and AUTO/MANUAL mode
        run: python3 tools/v243_controller_quadrant_lock_mode_self_check.py
      - name: Verify v244 half-size RUN/BOOST controller visual and input radii
        run: python3 tools/v244_half_size_run_boost_controller_self_check.py
      - name: Verify v245 125-percent controller and RUN/BOOST hit sizes
        run: python3 tools/v245_controller_125_percent_self_check.py
      - name: Verify v246 fullscreen controller and button exclusion
        run: python3 tools/v246_fullscreen_controller_self_check.py
      - name: Verify v247 completely transparent operation zone and unchanged controls
        run: python3 tools/v247_transparent_controller_self_check.py
      - name: Verify v248 RUN and BOOST controller visuals and touch radii at 150 percent
        run: python3 tools/v248_controller_150_percent_self_check.py
      - name: Verify v249 exclusive lock hit contact and range
        run: python3 tools/v249_exclusive_attack_lock_self_check.py
      - name: Verify v250 500 boss HP and 100 HP for all target parts
        run: python3 tools/v250_target_hp_self_check.py
      - name: Verify v251 mesh-aligned target movement colliders and break lifecycle
        run: python3 tools/v251_target_part_movement_collision_self_check.py
      - name: Verify v252 screen-relative flick, character-facing forward, and unchanged other controls
        run: python3 tools/v252_screen_direction_step_self_check.py
      - name: Verify v253 Bash on-screen actor facing and future flick conventions
        run: python3 tools/v253_screen_facing_bash_self_check.py
      - name: Verify v254 eight-way 45-degree flick sectors for STEP and Bash
        run: python3 tools/v254_eight_way_flick_self_check.py
      - name: Verify v255 common character-forward axis for STEP and Bash
        run: python3 tools/v255_flick_front_consistency_self_check.py
      - name: Verify v256 accessible Bash flick timing and preserved eight sectors
        run: python3 tools/v256_bash_accessibility_self_check.py
      - name: Verify historic v257 reticle UI isolation after v258 revert
        run: python3 tools/v257_lock_marker_flick_axis_self_check.py
      - name: Verify v258 four-way 90-degree SERA facing flicks
        run: python3 tools/v258_four_way_character_facing_self_check.py
      - name: Verify v259 combo and Bash AUTO lock hold through input windows
        run: python3 tools/v259_combo_lock_hold_self_check.py
      - name: Verify v260 screen-cardinal STEP and character-forward Bash classification
        run: python3 tools/v260_screen_step_direction_self_check.py
      - name: Verify v238 perimeter mechanical frame, collision bounds and unchanged break logic
        run: python3 tools/v238_target_mecha_frame_self_check.py
      - name: Verify v239 rectangular body, same-height legs and low head collision geometry
        run: python3 tools/v239_target_rectangular_body_self_check.py
      - name: Verify v240 oversized rectangular limb meshes and matching hit bounds
        run: python3 tools/v240_target_large_limb_self_check.py
      - name: Verify v204 heavy-leg slide and separate BOOST effects
        run: python3 tools/v204_heavy_leg_slide_self_check.py
      - name: Verify v227 B/D SLIDE full-body two-foot leg IK
        run: python3 tools/v227_slide_leg_ik_self_check.py
      - name: Verify v228 level shoe soles and lowered hip during SLIDE
        run: python3 tools/v228_slide_flat_soles_self_check.py
      - name: Verify v229 SLIDE/BOOST fade and camera edge damping
        run: python3 tools/v229_slide_boost_camera_self_check.py
      - name: Verify v230 close-range BOOST camera stability
        run: python3 tools/v230_close_boost_camera_self_check.py
      - name: Verify v231 high-refresh camera physics interpolation
        run: python3 tools/v231_camera_physics_interpolation_self_check.py
      - name: Verify v232 left/right edge BOOST camera analytic framing
        run: python3 tools/v232_boost_edge_camera_self_check.py
      - name: Verify v233 minimum camera distance
        run: python3 tools/v233_close_camera_radius_self_check.py
      - name: Verify v234 velocity-aware near camera dolly
        run: python3 tools/v234_near_camera_dolly_self_check.py
      - name: Verify v205 authored back booster mockup and runtime import
        run: python3 tools/v205_back_booster_stub_self_check.py
      - name: Verify v206 authored pivots and limited rectangular exhaust effects
        run: python3 tools/v206_back_thruster_fx_self_check.py
      - name: Verify v207 held BOOST, nozzle steering and EN-empty warning
        run: python3 tools/v207_boost_exhaust_en_self_check.py
      - name: Verify v208 asymmetric back-thruster angle limits
        run: python3 tools/v208_thruster_angle_limits_self_check.py
      - name: Verify v209 nozzle pivot and RUN stability
        run: python3 tools/v209_nozzle_run_stability_self_check.py
      - name: Verify v210 downward nozzle steering on reverse BOOST/STEP
        run: python3 tools/v210_backstroke_thruster_self_check.py
      - name: Verify v211 authored Frontstep forward and diagonal STEP
        run: python3 tools/v211_frontstep_self_check.py
      - name: Verify v212 50 percent SLIDE and downward/right-down nozzles
        run: python3 tools/v212_slide_nozzle_screen_direction_self_check.py
      - name: Verify v213 left nozzle within down-right screen quadrant
        run: python3 tools/v213_left_nozzle_quadrant_self_check.py
      - name: Verify v214 continuous BOOST exhaust during direction turns
        run: python3 tools/v214_turn_boost_exhaust_self_check.py
      - name: Verify v215 bird legs sole grounding and stable animation keys
        run: python3 tools/v215_bird_gait_grounding_self_check.py
      - name: Verify v216 one-shot acceleration flare on STEP and homing
        run: python3 tools/v216_thruster_acceleration_burst_self_check.py
      - name: Verify v217 5x burst spread and 100ms opening
        run: python3 tools/v217_thruster_burst_size_time_self_check.py
      - name: Verify v218 segmented exhaust flare grows to 15x at quarter length
        run: python3 tools/v218_thruster_short_15x_flare_self_check.py
      - name: Verify v219 decagonal thruster jet and 50ms flare
        run: python3 tools/v219_decagonal_thruster_50ms_self_check.py
      - name: Verify v220 sustained normal melee thruster through full swing
        run: python3 tools/v220_melee_full_swing_exhaust_self_check.py
      - name: Verify v221 visible continuous melee jets and stable nozzle heading
        run: python3 tools/v221_melee_jet_visibility_self_check.py
      - name: Verify v222 physical nozzle stays outside animated Chest during melee
        run: python3 tools/v222_nozzle_torso_clearance_self_check.py
      - name: Verify v223 world-space ribbon thruster trails
        run: python3 tools/v223_thruster_ribbon_trail_self_check.py
      - name: Verify v224 physically bounded nozzles during all melee clips
        run: python3 tools/v224_melee_nozzle_articulation_self_check.py
      - name: Verify v225 depth-correct drawing above melee foreground overlay
        run: python3 tools/v225_thruster_draw_order_self_check.py
      - name: Verify v241 world-down lift bias on both rear nozzles and LEFT screen sector
        run: python3 tools/v241_thruster_lift_downwash_self_check.py
      - name: Verify v261 continuous rear-diagonal back-thruster/downwash blending
        run: python3 tools/v261_rear_diagonal_thruster_self_check.py
      - name: Verify v262 full-angle STEP movement and four-clip pose blending
        run: python3 tools/v262_continuous_step_blend_self_check.py
      - name: Verify shared transparent render contract and new shaders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/render_policy_self_check.py
      - name: Verify base model, repository paths and development fast path
        run: |
          python3 tools/sera_quick_check.py
          python3 tools/sera_code_map.py camera --json > /dev/null
          python3 tools/sera_agent_audits_self_check.py
          python3 tools/sera_parameter_audit.py
          python3 tools/sera_change_impact.py --changed scripts/main.gd --json > /dev/null
