      - name: Verify v217 5x burst spread and 100ms opening
        run: python3 tools/v217_thruster_burst_size_time_self_check.py
      - name: Verify v218 segmented exhaust flare grows to 15x at quarter length
        run: python3 tools/v218_thruster_short_15x_flare_self_check.py
      - name: Verify v219 decagonal thruster jet and 50ms flare
        run: python3 tools/v219_decagonal_thruster_50ms_self_check.py
      - name: Verify v220 sustained normal melee thruster through full swing
        run: python3 tools/v220_melee_full_swing_exhaust_self_check.py
      - name: Verify v221 visible continuous melee jets and stable nozzle heading
        run: python3 tools/v221_melee_jet_visibility_self_check.py
      - name: Verify v222 physical nozzle stays outside animated Chest during melee
        run: python3 tools/v222_nozzle_torso_clearance_self_check.py
      - name: Verify v223 world-space ribbon thruster trails
        run: python3 tools/v223_thruster_ribbon_trail_self_check.py
      - name: Verify v224 physically bounded nozzles during all melee clips
        run: python3 tools/v224_melee_nozzle_articulation_self_check.py
      - name: Verify v225 depth-correct drawing above melee foreground overlay
        run: python3 tools/v225_thruster_draw_order_self_check.py
      - name: Verify v241 world-down lift bias on both rear nozzles and LEFT screen sector
        run: python3 tools/v241_thruster_lift_downwash_self_check.py
      - name: Verify v261 continuous rear-diagonal back-thruster/downwash blending
