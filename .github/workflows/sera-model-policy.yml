      - name: Verify v263 STEP alignment near boss and rig yaw tracking
        run: python3 tools/v263_close_step_screen_alignment_self_check.py
      - name: Verify v264 post-combo lateral kick and synced authored clips
        run: python3 tools/v264_side_kick_followup_self_check.py
      - name: Verify v265 embedded kick animation and touch-down link retention
