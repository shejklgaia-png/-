jobs:
  model-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify model guide and explicit review acknowledgement
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/model_policy_check.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Verify v189 bird legs and Head C assets
        run: python3 tools/v189_bird_headc_self_check.py
      - name: Verify v190 turning, contact and grounding
        run: python3 tools/v190_foot_contact_grounding_self_check.py
      - name: Verify v191 standard Foot C attachment
        run: python3 tools/v191_standard_foot_c_self_check.py
      - name: Verify v192 Foot C independent slot and Nexus preview
        run: python3 tools/v192_foot_slot_preview_self_check.py
      - name: Verify v193 lower-body D and legacy C/D preferences
        run: python3 tools/v193_lower_body_slot_migration_self_check.py
      - name: Verify updated C author hierarchy and D runtime-ready model
        run: python3 tools/legs_c_standard_source_self_check.py
      - name: Verify v194 dedicated lower-body D customization
        run: python3 tools/v194_lower_body_d_customization_self_check.py
      - name: Verify v195 D authored proportions and colors
        run: python3 tools/v195_lower_body_d_proportions_self_check.py
      - name: Verify v196 Nexus pose and adaptive arm clearance
        run: python3 tools/v196_nexus_pose_arm_clearance_self_check.py
      - name: Verify v197 NEXUS pose collision and lift cap
        run: python3 tools/v197_nexus_pose_overlift_self_check.py
      - name: Verify v198 version indicator on all screens
        run: python3 tools/v198_version_indicator_self_check.py
      - name: Verify v199 dynamic shoe sole grounding
        run: python3 tools/v199_animated_sole_grounding_self_check.py
      - name: Verify v200 foot-contact grounding and 360-degree step
        run: python3 tools/v200_contact_omni_step_self_check.py
      - name: Verify v235 3m forward STEP and unchanged lateral/backward STEP
        run: python3 tools/v235_forward_step_distance_self_check.py
      - name: Verify v236 lateral STEP constant speed, radial STEP preserved
        run: python3 tools/v236_lateral_step_no_proximity_slowdown_self_check.py
      - name: Verify v237 five-part target, part breaks and auto-lock
        run: python3 tools/v237_target_parts_break_lock_self_check.py
      - name: Verify v242 screen-relative lock switch buttons and isolated touch
        run: python3 tools/v242_screen_lock_buttons_self_check.py
      - name: Verify v243 bottom-right quadrant controller and AUTO/MANUAL mode
        run: python3 tools/v243_controller_quadrant_lock_mode_self_check.py
      - name: Verify v244 half-size RUN/BOOST controller visual and input radii
        run: python3 tools/v244_half_size_run_boost_controller_self_check.py
      - name: Verify v245 125-percent controller and RUN/BOOST hit sizes
        run: python3 tools/v245_controller_125_percent_self_check.py
      - name: Verify v246 fullscreen controller and button exclusion
        run: python3 tools/v246_fullscreen_controller_self_check.py
      - name: Verify v247 completely transparent operation zone and unchanged controls
        run: python3 tools/v247_transparent_controller_self_check.py
      - name: Verify v248 RUN and BOOST controller visuals and touch radii at 150 percent
        run: python3 tools/v248_controller_150_percent_self_check.py
      - name: Verify v249 exclusive lock hit contact and range
        run: python3 tools/v249_exclusive_attack_lock_self_check.py
      - name: Verify v250 500 boss HP and 100 HP for all target parts
        run: python3 tools/v250_target_hp_self_check.py
      - name: Verify v251 mesh-aligned target movement colliders and break lifecycle
        run: python3 tools/v251_target_part_movement_collision_self_check.py
      - name: Verify v252 screen-relative flick, character-facing forward, and unchanged other controls
