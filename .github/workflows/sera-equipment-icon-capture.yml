name: SERA Equipment PNG Recapture (assets only)
# This workflow generates real PNG assets. It deliberately runs no CI tests.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sera-equipment-icon-capture.yml'

permissions:
  contents: write

concurrency:
  group: sera-equipment-icon-capture-main
  cancel-in-progress: false

jobs:
  capture:
    name: Capture and commit 19 native equipment PNGs (no tests)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install software OpenGL display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"

      - name: Import model resources (asset preparation only)
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" \
            --headless --editor --path . --import --quit

      - name: Photograph all 19 equipment parts with the current NEXUS ID renderer
        env:
          GODOT_BIN: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1024x1024x24' \
            python3 tools/icon_studio/recapture_all_icons.py

      - name: Publish generated PNGs and manifest to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/sera_equipment_icons/*.png \
                  assets/ui/sera_equipment_icons/manifest.json
          if git diff --cached --quiet; then
            echo 'All native equipment PNGs already match main.'
          else
            git commit -m 'SERA: recapture all 19 equipment icons with current NEXUS renderer'
            git push origin HEAD:main
          fi

      - name: Preserve generated PNGs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sera-equipment-native-id-icons-19
          path: |
            assets/ui/sera_equipment_icons/*.png
            assets/ui/sera_equipment_icons/manifest.json
          if-no-files-found: error
          retention-days: 14
