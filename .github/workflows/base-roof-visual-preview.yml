name: SERA BASE readable roof preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sera_base_roof_identity.gd'
      - 'scripts/sera_base_architecture.gd'
      - 'scripts/sera_base_night_facade.gd'
      - 'scripts/sera_base_structural_mass.gd'
      - 'scripts/sera_base_silhouette_refinement.gd'
      - 'scripts/sera_base_reference_polish.gd'
      - 'tools/base_roof_identity_*'
      - '.github/workflows/base-roof-visual-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Plan impact and verify BASE contract
        run: |
          python3 tools/sera_workplan.py --query 'BASE 屋根 施設の視認性' --json > "$RUNNER_TEMP/base-roof-plan.json"
          python3 tools/base_roof_identity_self_check.py
          python3 tools/base_night_facility_self_check.py
          python3 tools/base_structural_mass_self_check.py
      - name: Install Godot 4.7.2 and virtual display
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import BASE resources for rendering
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --editor --path . --import --quit
      - name: Render actual 720x1280 GL Compatibility BASE screenshot
        env:
          SERA_UI_RENDER_DIR: ${{ runner.temp }}/base-roof-visual
        run: |
          set -euo pipefail
          mkdir -p "$SERA_UI_RENDER_DIR"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          xvfb-run -a -s '-screen 0 720x1280x24' \
            "$GODOT" --path . --rendering-method gl_compatibility \
            --script tools/base_isometric_visual_capture.gd
          test -s "$SERA_UI_RENDER_DIR/sera_base_orthographic.png"
      - name: Check actual eight BASE silhouettes and touch behavior
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          "$GODOT" --headless --path . --script tools/base_roof_identity_runtime_check.gd
          "$GODOT" --headless --path . --script tools/base_structural_mass_runtime_check.gd
      - name: Upload real BASE visual check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sera-base-roof-rework-portrait
          path: ${{ runner.temp }}/base-roof-visual/sera_base_orthographic.png
          if-no-files-found: warn
          retention-days: 14
