name: SERA legacy static regression diagnostic
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/**'
      - 'project.godot'
      - '.github/workflows/sera-static-diagnostic.yml'
  workflow_dispatch:
jobs:
  legacy-static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all legacy CI Python check scripts without stopping on first failure
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          ci = pathlib.Path(".github/workflows/sera-model-policy.yml").read_text(encoding="utf-8")
          files = list(dict.fromkeys(re.findall(r"python3 tools/([A-Za-z0-9_]+\.py)", ci)))
          failed = []
          for i, name in enumerate(files, 1):
              path = pathlib.Path("tools") / name
              if not path.exists() or name == "model_policy_check.py":
                  continue
              try:
                  p = subprocess.run(["python3", str(path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=45)
                  if p.returncode:
                      interesting = [x.strip() for x in p.stdout.splitlines() if "assert " in x or "AssertionError" in x or "Error" in x or "Traceback" in x]
                      failed.append((name, p.returncode, " | ".join(interesting[-4:])[:500]))
              except subprocess.TimeoutExpired:
                  failed.append((name, -1, "timeout 45s"))
          print("AUDIT_FILES", len(files), "AUDIT_FAILURES", len(failed), flush=True)
          for name, code, msg in failed:
              print("AUDIT_FAIL", name, code, msg, flush=True)
          if failed:
              raise SystemExit(1)
          PY
