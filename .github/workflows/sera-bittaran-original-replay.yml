# Source replay CI is intentionally post-merge on main (or manual dispatch).
name: SERA Bittaran source replay and skeletal IK

on:
  push:
    branches: [main]
    paths:
      - 'models/storage/ビットタラン (1).bbmodel'
      - 'models/bosses/Bittaran.bbmodel'
      - 'models/storage/ビットタラン_20261118_新なぎ払い.bbmodel'
      - 'tools/bittaran_uploaded_full_sweep_runtime_check.gd'
      - 'tools/bittaran_uploaded_sweep_battle_runtime_check.gd'
      - 'assets/bittaran_data.gd'
      - 'scripts/bittaran_*.gd'
      - 'scripts/main.gd'
      - 'scripts/back_thruster_fx.gd'
      - 'scripts/sera_thruster_audio.gd'
      - 'assets/sera_thruster_*.ogg'
      - 'tools/sera_thruster_audio_runtime_check.gd'
      - 'scenes/bittaran_battle.tscn'
      - 'tools/v434_bittaran_blockbench_exact_playback_runtime_check.gd'
      - 'tools/v435_bittaran_gait_three_support_runtime_check.gd'
      - 'tools/v436_bittaran_attack_timing_runtime_check.gd'
      - 'tools/v438_bittaran_boot_runtime_check.gd'
      - 'tools/v440_bittaran_flat_floor_chain_runtime_check.gd'
      - 'tools/v447_bittaran_toe_drag_reach_check.gd'
      - 'tools/bittaran_attack_variation_runtime_check.gd'
      - 'tools/bittaran_keyframe_hit_sector_runtime_check.gd'
      - 'tools/bittaran_stomp_follow_runtime_check.gd'
      - 'tools/bittaran_repeat_live_battle_runtime_check.gd'
      - 'tools/bittaran_attack_distance_priority_runtime_check.gd'
      - 'tools/bittaran_ground_fx_rebuild_runtime_check.gd'
      - 'tools/bittaran_fx_continuity_runtime_check.gd'
      - 'tools/bittaran_sweep_prebaked_fx_runtime_check.gd'
      - '.github/workflows/sera-bittaran-original-replay.yml'
  workflow_dispatch:

jobs:
  verify-source-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot for source playback verification
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import Godot resources
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit
      - name: Verify real 01 thruster loop plus 13-1 step and homing acceleration audio
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/sera_thruster_audio_runtime_check.gd
      - name: Verify uploaded full front/rear sweep keys, right mirrors, 1x playback and Android fallback
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_uploaded_full_sweep_runtime_check.gd
      - name: Verify all four authored sweeps in the actual battle with three planted supports
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_uploaded_sweep_battle_runtime_check.gd
      - name: Verify Bittaran never repeats the same attack and repositions
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_attack_variation_runtime_check.gd
      - name: Verify multiple consecutive autonomous Bittaran attacks in a stationary SERA encounter
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_repeat_live_battle_runtime_check.gd
      - name: Export actual post-IK foot trajectories to build immutable FX curves
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_sweep_fx_export_runtime_check.gd
      - name: Verify four prebaked Blockbench sweep trajectories and source-timed FX
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_sweep_prebaked_fx_runtime_check.gd
      - name: Verify all four sweep, stomp and kick visual FX without restarts or missing clouds
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_fx_continuity_runtime_check.gd
      - name: Verify rebuilt ground-anchored effects and dense toe-sweep trail
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_ground_fx_rebuild_runtime_check.gd
      - name: Verify close STOMP and separated frontal KICK after three live walking steps
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_attack_distance_priority_runtime_check.gd
      - name: Diagnose exact first-ground sweep trajectory, stomp contact and close-range attack selection
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_sweep_stomp_timeline_runtime_check.gd
      - name: Verify all four front/rear STOMPs follow the 1.5x toe box, strike in air once, and burst only on contact
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_stomp_follow_runtime_check.gd
      - name: Verify keyframe-accurate KICK/SWEEP hit windows, real floor contact and positional attack selection
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_keyframe_hit_sector_runtime_check.gd
      - name: Verify inward toe-floor drag reach projection in 4096 cases
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v447_bittaran_toe_drag_reach_check.gd
      - name: Verify live sweep toe straight drag and shin continuity for all four legs
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/bittaran_sweep_parallel_drag_runtime_check.gd
      - name: Verify independent original Blockbench Euler playback
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v434_bittaran_blockbench_exact_playback_runtime_check.gd
      - name: Verify walk and turn IK plus 3 grounded support feet in each source attack
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v435_bittaran_gait_three_support_runtime_check.gd
      - name: Verify six attacks, 2-second sweep turnaround, body-first smooth leg return
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v436_bittaran_attack_timing_runtime_check.gd
      - name: Verify startup goes directly to the Bittaran battle
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v438_bittaran_boot_runtime_check.gd
      - name: Verify fixed plane floor contact and attached mesh/chain joints
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v440_bittaran_flat_floor_chain_runtime_check.gd
