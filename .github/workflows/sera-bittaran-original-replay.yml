name: SERA Bittaran source replay and skeletal IK

on:
  push:
    branches: [main]
    paths:
      - 'models/storage/ビットタラン (1).bbmodel'
      - 'models/bosses/Bittaran.bbmodel'
      - 'assets/bittaran_data.gd'
      - 'scripts/bittaran_*.gd'
      - 'scenes/bittaran_battle.tscn'
      - 'tools/v434_bittaran_blockbench_exact_playback_runtime_check.gd'
      - 'tools/v435_bittaran_gait_three_support_runtime_check.gd'
      - 'tools/v436_bittaran_attack_timing_runtime_check.gd'
      - '.github/workflows/sera-bittaran-original-replay.yml'
  pull_request:
    paths:
      - 'models/storage/ビットタラン (1).bbmodel'
      - 'models/bosses/Bittaran.bbmodel'
      - 'assets/bittaran_data.gd'
      - 'scripts/bittaran_*.gd'
      - 'scenes/bittaran_battle.tscn'
      - 'tools/v434_bittaran_blockbench_exact_playback_runtime_check.gd'
      - 'tools/v435_bittaran_gait_three_support_runtime_check.gd'
      - 'tools/v436_bittaran_attack_timing_runtime_check.gd'
      - '.github/workflows/sera-bittaran-original-replay.yml'
  workflow_dispatch:

jobs:
  verify-source-replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot for source playback verification
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import Godot resources
        run: |
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit
      - name: Verify independent original Blockbench Euler playback
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v434_bittaran_blockbench_exact_playback_runtime_check.gd
      - name: Verify walk and turn IK plus 3 grounded support feet in each source attack
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v435_bittaran_gait_three_support_runtime_check.gd
      - name: Verify six attacks' transition timings, sweep slow-motion, holds and exact source keys
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --path . --script tools/v436_bittaran_attack_timing_runtime_check.gd
