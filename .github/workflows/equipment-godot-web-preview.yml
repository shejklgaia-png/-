name: SERA Equipment Godot Web Preview

on:
  pull_request:
    paths:
      - 'tools/equipment_intake/**'
      - '.github/workflows/equipment-godot-web-preview.yml'
      - 'scripts/sera_rig.gd'
      - 'scripts/sera_equipment.gd'
      - 'scripts/sera_view_edges.gd'
      - 'shaders/**'
      - 'assets/sera_*'
  push:
    branches: [main]
    paths:
      - 'tools/equipment_intake/**'
      - '.github/workflows/equipment-godot-web-preview.yml'
      - 'scripts/sera_rig.gd'
      - 'scripts/sera_equipment.gd'
      - 'scripts/sera_view_edges.gd'
      - 'shaders/**'
      - 'assets/sera_*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sera-equipment-godot-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Godot 4.7.2 editor and templates
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 3 --connect-timeout 20 --max-time 240 \
            -o "$RUNNER_TEMP/godot-editor.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
          curl -fL --retry 3 --connect-timeout 20 --max-time 600 \
            -o "$RUNNER_TEMP/templates.tpz" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          python3 - <<'PY'
          import pathlib, zipfile, os, shutil
          package=pathlib.Path(os.environ['RUNNER_TEMP'])/'templates.tpz'
          dest=pathlib.Path.home()/'.local/share/godot/export_templates/4.7.2.stable'
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(package) as zp:
              for name in ('web_nothreads_release.zip','web_nothreads_debug.zip'):
                  matches=[x for x in zp.namelist() if x.endswith('/'+name)]
                  assert len(matches)==1,(name,matches)
                  with zp.open(matches[0]) as source,(dest/name).open('wb') as target:
                      shutil.copyfileobj(source,target)
                  print('GODOT_WEB_TEMPLATE',name,(dest/name).stat().st_size)
          PY
      - name: Assemble minimal real-game Godot project and styled HTML shell
        run: |
          python3 tools/equipment_intake/build_web_preview.py \
            --stage "$RUNNER_TEMP/sera-web-project" --site "$RUNNER_TEMP/sera-equipment-site"
          node --check "$RUNNER_TEMP/sera-equipment-site/godot_bridge.js"
          node --check "$RUNNER_TEMP/sera-equipment-site/intake_ui.js"
      - name: Import and export SERA native preview for browser
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$RUNNER_TEMP/sera-web-project" --import --quit
          "$GODOT_BIN" --headless --path "$RUNNER_TEMP/sera-web-project" --script tools/equipment_intake/preview_runtime_check.gd
          "$GODOT_BIN" --headless --path "$RUNNER_TEMP/sera-web-project" \
            --export-release "SERA Equipment Web" "$RUNNER_TEMP/sera-equipment-site/preview/preview.html"
          test -s "$RUNNER_TEMP/sera-equipment-site/preview/preview.html"
          test -n "$(find "$RUNNER_TEMP/sera-equipment-site/preview" -maxdepth 1 -name '*.wasm' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/sera-equipment-site/preview" -maxdepth 1 -name '*.pck' -print -quit)"
          grep -q 'id="godotPreview"' "$RUNNER_TEMP/sera-equipment-site/index.html"
          ! grep -q 'id="glview"' "$RUNNER_TEMP/sera-equipment-site/index.html"
          du -h "$RUNNER_TEMP/sera-equipment-site/preview/"*
      - name: Upload entire runnable Web package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SERA-Godot-Equipment-Preview-Web
          path: ${{ runner.temp }}/sera-equipment-site/
          if-no-files-found: warn
          retention-days: 30

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SERA-Godot-Equipment-Preview-Web
          path: _site
      - name: Detect GitHub Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SERA_PAGES_READY: GitHub Pages is already enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SERA_PAGES_NOT_CONFIGURED: enable Settings > Pages > Source: GitHub Actions"
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for unique Pages artifact API registration
        if: steps.pages.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # upload-pages-artifact writes one special artifact. deploy-pages
          # sometimes races its metadata indexing and reports "No artifacts".
          # A new workflow run must be used after a failed deploy: re-running
          # the same run uploads a second github-pages and fails as duplicates.
          for attempt in $(seq 1 15); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)"
            if [ "$count" = "1" ]; then
              echo "SERA_PAGES_ARTIFACT_READY: one artifact visible (attempt $attempt)"
              sleep 12
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple github-pages artifacts in one run; start a fresh workflow, do not re-run this job."
              exit 1
            fi
            sleep 4
          done
          echo "::error::github-pages artifact not available after 15 checks"
          exit 1
      - if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
