name: Build SERA Loader APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/sera-loader/**'
      - '.github/workflows/sera-loader-build.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/sera-loader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SERA-Loader-debug-apk
          path: tools/sera-loader/app/build/outputs/apk/debug/app-debug.apk
