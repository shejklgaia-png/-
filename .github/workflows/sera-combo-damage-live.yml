name: SERA combo damage live Godot verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/sera_combo_damage_runtime_check.gd'
      - 'tools/sera_ci_manifest.txt'
      - '.github/workflows/sera-combo-damage-live.yml'
  workflow_dispatch:

jobs:
  live-combo-damage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect focused combat source and CI routing
        run: python3 tools/sera_workplan.py --query "combo damage" --json
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
      - name: Import actual SERA assets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" --headless --editor --path . --import --quit
      - name: Execute real Bittaran combo damage regression
        shell: bash
        run: |
          set -euo pipefail
          game="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          timeout 120s "$game" --headless --path . --script res://tools/sera_combo_damage_runtime_check.gd 2>&1 | tee "$RUNNER_TEMP/combo-damage.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|SERA_COMBO_DAMAGE_RUNTIME_FAIL|ERROR: Failed to load' "$RUNNER_TEMP/combo-damage.log"; then
            echo "::error::Godot reported runtime or parse failure"
            exit 1
          fi
          grep -q 'SERA_COMBO_DAMAGE_GODOT_PASS' "$RUNNER_TEMP/combo-damage.log"
